<style>
/* Layout: one phone-width column, summary card first, day timeline below, tab bar at the bottom. */
:root{
  --bg:#eef1f6; --card:#ffffff; --ink:#14213d; --mute:#5b6577; --line:#d9deea; --accent:#2b4acb; --accent-ink:#ffffff;
  --own:#2b4acb; --own-bg:#e6eaff;
  --a:#d9651f; --a-bg:#fde3d2; --d:#2f78bd; --d-bg:#dbe9f7; --g:#3f8a4d; --g-bg:#dff0e0;
  --warn:#b4231a; --brk:#fff3cc; --brk-ink:#7a5b00;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif; --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1524; --card:#18203a; --ink:#e8ecf8; --mute:#9aa6c2; --line:#2a3454; --accent:#7f98ff; --accent-ink:#0f1524;
  --own:#8ea4ff; --own-bg:#222d57; --a:#f19a62; --a-bg:#47291a; --d:#7db6ea; --d-bg:#1b3350; --g:#7fc78c; --g-bg:#1c3a25; --warn:#ff8b80; --brk:#3d3413; --brk-ink:#f0d77a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1524; --card:#18203a; --ink:#e8ecf8; --mute:#9aa6c2; --line:#2a3454; --accent:#7f98ff; --accent-ink:#0f1524;
  --own:#8ea4ff; --own-bg:#222d57; --a:#f19a62; --a-bg:#47291a; --d:#7db6ea; --d-bg:#1b3350; --g:#7fc78c; --g-bg:#1c3a25; --warn:#ff8b80; --brk:#3d3413; --brk-ink:#f0d77a; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:14px 16px calc(92px + env(safe-area-inset-bottom));min-height:100%}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.greet{font-size:14px;color:var(--mute)}
.date{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.1}
.navbtns{display:flex;gap:6px}
.ib{border:1px solid var(--line);background:var(--card);border-radius:12px;min-width:44px;height:44px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mute)}
.chip.prog{background:var(--own-bg);color:var(--own);border-color:transparent}
.chip.a{background:var(--a-bg);color:var(--a);border-color:transparent}
.chip.off{background:var(--brk);color:var(--brk-ink);border-color:transparent}
.hero{border-radius:20px;padding:18px;background:var(--own);color:#fff;margin-bottom:14px}
.hero.kA{background:var(--a)} .hero.kD{background:var(--d)} .hero.kG{background:var(--g)} .hero.idle{background:var(--card);color:var(--ink);border:1px solid var(--line)}
:root[data-theme="dark"] .hero:not(.idle){color:#0f1524}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero:not(.idle){color:#0f1524}}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.9}
.count{font-family:var(--display);font-size:40px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.h-title{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.15}
.h-meta{opacity:.92;margin-top:2px}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.35);margin:12px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:99px}
.hero.idle .bar{background:var(--line)} .hero.idle .bar i{background:var(--accent)}
.nextline{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.35);font-size:15px}
.hero.idle .nextline{border-color:var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--mute)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 8px}
.sec h2{font-size:18px}
.sec small{color:var(--mute)}
.tl{display:flex;flex-direction:column;gap:8px}
.blk{display:grid;grid-template-columns:74px 1fr;gap:12px;text-align:left;width:100%;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--card);border-left:6px solid var(--own)}
.blk.kA{border-left-color:var(--a);background:linear-gradient(0deg,var(--card),var(--card)) padding-box} .blk.kD{border-left-color:var(--d)} .blk.kG{border-left-color:var(--g)}
.blk .time{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;line-height:1.25}
.blk .time span{font-weight:500;color:var(--mute)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--own-bg);color:var(--own);margin-bottom:3px}
.kA .tag{background:var(--a-bg);color:var(--a)} .kD .tag{background:var(--d-bg);color:var(--d)} .kG .tag{background:var(--g-bg);color:var(--g)}
.ttl{font-family:var(--display);font-size:19px;font-weight:700;line-height:1.2}
.meta{font-size:14px;color:var(--mute);margin-top:2px}
.blk.past{opacity:.5} .blk.now{box-shadow:0 0 0 3px var(--accent)}
.free{display:flex;justify-content:space-between;gap:8px;width:100%;padding:8px 12px;border-radius:12px;border:1px dashed var(--line);background:transparent;color:var(--mute);font-size:14px;text-align:left}
.free b{font-weight:600}
.brk{padding:6px 12px;border-radius:12px;background:var(--brk);color:var(--brk-ink);font-size:14px;font-weight:600;display:flex;justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{font-size:17px;margin-bottom:6px}
.card p{margin:4px 0;color:var(--mute);font-size:14.5px}
.daycard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.daycard.today{box-shadow:0 0 0 2px var(--accent)}
.daycard .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-family:var(--display);font-weight:700;font-size:17px}
.ln{display:flex;gap:10px;font-size:14.5px;padding:3px 0;font-variant-numeric:tabular-nums}
.ln .t{min-width:62px;color:var(--mute)} .ln .s{width:8px;border-radius:4px;background:var(--own);flex:none}
.ln.kA .s{background:var(--a)} .ln.kD .s{background:var(--d)} .ln.kG .s{background:var(--g)}
.ln .x{color:var(--mute)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl tr.mine td{background:var(--own-bg)}
.scroll{overflow-x:auto}
.paper{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.paper:last-child{border-bottom:0}
.paper .pn{font-family:var(--display);font-weight:700;min-width:70px}
.paper.mine .pn{color:var(--own)}
.paper input{width:22px;height:22px;margin-top:2px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:6px;justify-content:center;z-index:5}
.nav button{flex:1;max-width:130px;border:0;background:transparent;border-radius:12px;padding:8px 4px;font-weight:600;color:var(--mute);min-height:44px}
.nav button[aria-current="page"]{background:var(--own-bg);color:var(--own)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:28px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:6}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.dng{color:var(--warn)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.row label{display:flex;align-items:center;gap:8px}
.fld{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.fld>span{font-size:13px;font-weight:600;color:var(--mute)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;min-height:44px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mask{position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92%;overflow:auto}
.sheet h2{font-size:20px;margin-bottom:4px}
#alert{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:30;max-width:536px;margin:0 auto;background:var(--warn);color:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
:root[data-theme="dark"] #alert{color:#1a0b09}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #alert{color:#1a0b09}}
#alert b{font-family:var(--display);font-size:19px;display:block}
#alert .row{margin-bottom:0}
#alert button{border:0;border-radius:10px;padding:8px 14px;font-weight:700;background:rgba(255,255,255,.9);color:#222}
.note{font-size:13.5px;color:var(--mute)}
.inp{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px;width:112px;font-size:13px}
@media (prefers-reduced-motion: no-preference){.hero,.blk{transition:box-shadow .2s}}
</style>
</head>
<body>
<div id="app"></div>
<div id="alert" hidden role="alert"></div>
<div id="modal"></div>
<nav class="nav" aria-label="Sections">
  <button data-tab="today">Today</button>
  <button data-tab="week">Week</button>
  <button data-tab="exams">Exams</button>
  <button data-tab="more">Settings</button>
</nav>
<button class="fab" id="fab" aria-label="Add a period">+</button>

<script>
const PROG=[["2026-11-23",2,"G","X-E French","Optional I"],["2026-11-23",5,"G","X-D French","Optional I"],["2026-11-23",6,"G","X-D + X-E French","AV Room"],["2026-11-23",7,"G","X-D French","Optional I"],["2026-11-23",10,"G","X-D French","Optional II"],["2026-11-25",1,"A","X-D + X-E French","AV Room"],["2026-11-25",2,"A","X-D + X-E French","AV Room"],["2026-11-25",9,"D","X-D + X-E French","AV Room"],["2026-11-25",10,"D","X-D + X-E French","AV Room"],["2026-11-30",9,"G","X-D French","Optional I"],["2026-12-01",4,"G","X-E French","Optional II"],["2026-12-01",7,"G","X-E French","Optional I"],["2026-12-02",1,"A","X-E French","Optional I"],["2026-12-02",2,"A","X-E French","Optional II"],["2026-12-02",9,"D","X-E French","AV Room"],["2026-12-02",10,"D","X-E French","Optional II"],["2026-12-07",4,"A","X-D French","Optional I"],["2026-12-07",5,"A","X-D French","Optional I"],["2026-12-07",6,"D","X-D French","Optional II"],["2026-12-07",7,"D","X-D French","Optional I"],["2026-12-07",9,"G","X-D French","Optional I"],["2026-12-08",4,"G","X-D + X-E French","AV Room"],["2026-12-08",7,"G","X-E French","Optional I"],["2026-12-08",8,"G","X-D + X-E French","AV Room"],["2026-12-09",1,"G","X-D + X-E French","Art Room"],["2026-12-09",2,"G","X-D + X-E French","AV Room"],["2026-12-09",9,"G","X-D + X-E French","AV Room"],["2026-12-10",3,"G","X-D + X-E French","AV Room"],["2026-12-21",9,"G","X-D + X-E French","AV Room"],["2026-12-22",1,"G","X-D + X-E French","AV Room"],["2026-12-22",8,"G","X-D + X-E French","AV Room"],["2026-12-22",9,"G","X-D + X-E French","AV Room"]];
const PROGDAYS=['2026-11-19','2026-11-20','2026-11-21','2026-11-23','2026-11-25','2026-11-26','2026-11-27','2026-11-30','2026-12-01','2026-12-02','2026-12-03','2026-12-04','2026-12-07','2026-12-08','2026-12-09','2026-12-10','2026-12-21','2026-12-22'];
const PER={1:['08:05','08:40'],2:['08:40','09:15'],3:['09:15','09:50'],4:['09:50','10:25'],5:['10:25','11:00'],6:['11:30','12:05'],7:['12:05','12:40'],8:['12:40','13:10'],9:['13:10','13:40'],10:['13:40','14:10']};
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WDL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const KIND={own:'Class',A:'Assessment',D:'Discussion of the paper',G:'Guided practice'};
const EXAMS=[
 ['X-A','Sat 21 Nov','8:00–9:10','9:10–10:20','AV Room, with X-B','Urvi Batavia',0],
 ['X-A','Fri 27 Nov','8:05–9:15','9:15–10:25','Optional I, with X-C','Urvi Batavia',0],
 ['X-B','Sat 21 Nov','8:00–9:10','9:10–10:20','AV Room, with X-A','Urvi Batavia',0],
 ['X-B','Wed 2 Dec','8:40–9:50','1:10–2:10','Optional I','Urvi Batavia',0],
 ['X-C','Wed 25 Nov','8:05–9:15','1:10–2:10','Optional I','Urvi Batavia',0],
 ['X-C','Fri 27 Nov','8:05–9:15','9:15–10:25','Optional I, with X-A','Urvi Batavia',0],
 ['X-D','Wed 25 Nov','8:05–9:15','1:10–2:10','AV Room, with X-E','Haresh Dholwani',1],
 ['X-D','Mon 7 Dec','9:50–11:00','11:30–12:40','Optional I / II','Haresh Dholwani',1],
 ['X-E','Wed 25 Nov','8:05–9:15','1:10–2:10','AV Room, with X-D','Haresh Dholwani',1],
 ['X-E','Wed 2 Dec','8:05–9:15','1:10–2:10','Optional I, then II','Haresh Dholwani',1]];
const PAPERS=[
 {id:'p1',n:1,when:'Sat 21 Nov, 8:00–9:10',who:'10A + 10B (combined)',by:'Urvi Batavia',mine:0,date:'2026-11-21'},
 {id:'p2',n:2,when:'Wed 25 Nov, 8:05–9:15',who:'10C (single)',by:'Urvi Batavia',mine:0,date:'2026-11-25'},
 {id:'p3',n:3,when:'Wed 25 Nov, 8:05–9:15',who:'10D + 10E (combined)',by:'You',mine:1,date:'2026-11-25'},
 {id:'p4',n:4,when:'Fri 27 Nov, 8:05–9:15',who:'10A + 10C (combined)',by:'Urvi Batavia',mine:0,date:'2026-11-27'},
 {id:'p5',n:5,when:'Wed 2 Dec, 8:40–9:50',who:'10B (single)',by:'Urvi Batavia',mine:0,date:'2026-12-02'},
 {id:'p6',n:6,when:'Wed 2 Dec, 8:05–9:15',who:'10E (single)',by:'You',mine:1,date:'2026-12-02'},
 {id:'p7',n:7,when:'Mon 7 Dec, 9:50–11:00',who:'10D (single)',by:'You',mine:1,date:'2026-12-07'}];

/* ---------- state ---------- */
const KEY='haresh-tt-v1';
function defaults(){return{
 settings:{alarms:false,lead:5,morningOn:false,morning:'06:30',eveningOn:false,evening:'20:00',sound:true},
 weekly:{
  Mon:{3:{t:'IX A-C French'},8:{t:'VIII E French'},10:{t:'X D-E French'}},
  Tue:{3:{t:'VIII E'},4:{t:'X D-E French'},5:{t:'VIII A'},8:{t:'X D-E French'},9:{t:'X D-E French'},10:{t:'IX A-C French'}},
  Wed:{4:{t:'X D-E French'},5:{t:'VIII A'},8:{t:'IX A-C French'}},
  Thu:{1:{t:'IX A-C French'},2:{t:'IX A-C French'},3:{t:'X D-E French'},4:{t:'VIII E'},5:{t:'VIII E'},9:{t:'VIII A'},10:{t:'VIII A'}},
  Fri:{},Sat:{}},
 over:{},off:{},papers:{}};}
let S=defaults();
try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(defaults(),JSON.parse(r));}catch(e){}
let dbDoc=null,saveTimer=null;
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(dbDoc){clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{try{await dbDoc.set({state:JSON.stringify(S)});}catch(e){}},700);}
}
async function initDb(){
  try{
    if(typeof claude==='undefined') return;
    const user=await claude.use('user'), db=await claude.use('db');
    if(!user||!db) return;
    const id=await user.id(); if(!id) return;
    const ref=db.collection('data/users/'+id).doc('tt');
    const snap=await ref.get();
    if(snap.exists&&snap.data()&&snap.data().state){
      S=Object.assign(defaults(),JSON.parse(snap.data().state));
      try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
      dbDoc=ref; renderAll();
    } else { dbDoc=ref; persist(); }
  }catch(e){}
}

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const at=(day,hm)=>{const d=parse(day);const [h,m]=hm.split(':').map(Number);d.setHours(h,m,0,0);return d;};
const f12=hm=>{let [h,m]=hm.split(':').map(Number);const s=h>=12?'pm':'am';h=h%12||12;return h+':'+pad(m)+' '+s;};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dlabel=s=>{const d=parse(s);return WD[d.getDay()]+' '+d.getDate()+' '+MN[d.getMonth()];};

/* ---------- schedule builder ---------- */
function buildDay(day){
  const d=parse(day), wd=WD[d.getDay()];
  if(S.off[day]) return {off:true,items:[],prog:false};
  const map={}, isProg=PROGDAYS.includes(day);
  const base=S.weekly[wd]||{};
  for(const p in base){const e=base[p]; if(!e||!e.t) continue; if(isProg&&/^X[\s-]/i.test(e.t.trim())) continue; map[p]={t:e.t,r:e.r||'',n:e.n||'',k:'own'};}
  for(const r of PROG) if(r[0]===day) map[r[1]]={t:r[3],r:r[4],n:'',k:r[2]};
  for(const key in S.over){const [dt,p]=key.split('|'); if(dt!==day) continue; const o=S.over[key]; if(o.removed) delete map[p]; else map[p]={t:o.t,r:o.r||'',n:o.n||'',k:o.k||'own'};}
  const ps=Object.keys(map).map(Number).sort((a,b)=>a-b), items=[];
  for(const p of ps){
    const m=map[p], last=items[items.length-1];
    if(last&&last.k===m.k&&last.t===m.t&&last.r===m.r&&last.n===m.n&&last.pe===p-1&&p!==6){last.pe=p;last.ps.push(p);last.end=PER[p][1];}
    else items.push({p0:p,pe:p,ps:[p],t:m.t,r:m.r,n:m.n,k:m.k,start:PER[p][0],end:PER[p][1]});
  }
  return {off:false,items,prog:isProg};
}

/* ---------- ui state ---------- */
let tab='today', cur=iso(new Date()), weekStart=null;
const $=s=>document.querySelector(s);
const timeRange=it=>`${f12(it.start)}<br><span>${f12(it.end)}</span>`;
const pLabel=it=>it.p0===it.pe?'P'+it.p0:`P${it.p0}–P${it.pe}`;

function closeModal(){$('#modal').innerHTML='';}
function saveEdit(){
  const t=$('#e-t').value.trim(); if(!t){$('#e-t').focus();return;}
  let a=+$('#e-s').value, z=+$('#e-e').value; if(z<a){const x=a;a=z;z=x;}

  const p0=+$('#modal').dataset.p0, isNew=$('#modal').dataset.isnew==='1';
  const old=isNew?null:buildDay(cur).items.find(i=>i.p0===p0);
  if(old) old.ps.forEach(p=>{S.over[cur+'|'+p]={removed:true};});
  if(sc==='week'&&k==='own'){
    S.weekly[wd]=S.weekly[wd]||{};
    if(old) old.ps.forEach(p=>{delete S.weekly[wd][p]; delete S.over[cur+'|'+p];});
    for(let p=a;p<=z;p++){S.weekly[wd][p]={t,r,n}; delete S.over[cur+'|'+p];}

}
function delEdit(){

  persist(); closeModal(); renderAll();
}

/* ---------- alerts ---------- */
let actx=null; const fired=new Set();
function unlock(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume();}catch(e){}}
document.addEventListener('pointerdown',unlock);
function beep(n){
  if(!actx||!S.settings.sound) return; let t=actx.currentTime;
  for(let i=0;i<n;i++){const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=i%2?880:660;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.4);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.45);t+=.55;}
}
function raise(title,body,snoozeKey){
  const a=$('#alert'); a.hidden=false;
  a.innerHTML=`<b>${esc(title)}</b><div>${esc(body)}</div><div class="row"><button data-act="dismiss">Dismiss</button><button data-act="snooze" data-t="${esc(title)}" data-b="${esc(body)}">Snooze 5 min</button></div>`;
  beep(6); try{navigator.vibrate&&navigator.vibrate([300,150,300]);}catch(e){}
  try{if('Notification' in window&&Notification.permission==='granted'){ if(navigator.serviceWorker){navigator.serviceWorker.getRegistration().then(r=>{ if(r) r.showNotification(title,{body,icon:'icon-192.png',vibrate:[300,150,300]}); else new Notification(title,{body}); }).catch(()=>{try{new Notification(title,{body});}catch(e){}}); } else new Notification(title,{body}); }}catch(e){}
}
function tick(){
  const now=new Date(), t=iso(now), st=S.settings;
  if(st.alarms){
    for(const it of buildDay(t).items){
      const s=at(t,it.start), f=new Date(s-st.lead*60000), k=t+'c'+it.p0+st.lead;
      if(now>=f&&now<new Date(+s+(st.lead===0?60000:0))&&!fired.has(k)){fired.add(k);
        raise(`${it.t} ${st.lead?'in '+st.lead+' min':'now'}`,`${f12(it.start)}${it.r?' · '+it.r:''} · ${KIND[it.k]}`);}
    }
  }
  const sum=(day)=>{const b=buildDay(day);return b.items.length?`${b.items.length} blocks, first: ${b.items[0].t} at ${f12(b.items[0].start)}`:'No classes or duties';};
  if(st.morningOn){const m=at(t,st.morning);if(now>=m&&now<new Date(+m+600000)&&!fired.has(t+'m')){fired.add(t+'m');raise('Good morning, Haresh Sir',sum(t));}}
  if(st.eveningOn){const m=at(t,st.evening);if(now>=m&&now<new Date(+m+600000)&&!fired.has(t+'e')){fired.add(t+'e');raise('Tomorrow',sum(addDays(t,1)));}}
}

  else if(a==='copyb'){const msg=$('#s-msg');try{await navigator.clipboard.writeText(JSON.stringify(S));msg.textContent='Backup copied. Paste it somewhere safe.';}catch(err){$('#s-rest').value=JSON.stringify(S);msg.textContent='Copy blocked. The backup text is in the box below: select and copy it.';}}
  else if(a==='restore'){const msg=$('#s-msg');try{const o=JSON.parse($('#s-rest').value);S=Object.assign(defaults(),o);persist();msg.textContent='Restored.';renderAll();}catch(err){msg.textContent='That text is not a valid backup.';}}
  else if(a==='reset'){if(el.dataset.sure){S=defaults();persist();renderAll();}else{el.dataset.sure='1';el.textContent='Tap again to erase all edits';}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.paper){S.papers[t.dataset.paper]=t.checked;persist();return;}
  if(t.dataset.w){const w=t.dataset.w,p=t.dataset.p;S.weekly[w]=S.weekly[w]||{};const v=t.value.trim();if(v){S.weekly[w][p]=Object.assign({},S.weekly[w][p],{t:v});}else delete S.weekly[w][p];persist();return;}
  const st=S.settings;
  if(t.id==='s-alarms'){st.alarms=t.checked;unlock();try{if(t.checked&&'Notification' in window&&Notification.permission==='default') Notification.requestPermission().catch(()=>{});}catch(err){}}
  else if(t.id==='s-lead') st.lead=+t.value;
  else if(t.id==='s-morning') st.morningOn=t.checked; else if(t.id==='s-mt') st.morning=t.value||'06:30';
  else if(t.id==='s-evening') st.eveningOn=t.checked; else if(t.id==='s-et') st.evening=t.value||'20:00';
  else if(t.id==='s-sound') st.sound=t.checked; else return;
  persist();
});

/* ---------- boot ---------- */
document.getElementById('app').innerHTML='<div id="view"></div>';
renderAll();
setInterval(()=>{const h=$('#hero'); if(h&&tab==='today'&&cur===iso(new Date())) h.innerHTML=heroHTML();},1000);
setInterval(()=>{if(tab==='today'&&!$('#modal').innerHTML) renderToday();},30000);
setInterval(tick,5000); tick();
initDb();
try{if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');}catch(e){}
</script>
